<svg width="840" height="152" viewBox="0 0 840 152" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal session ending: exit, logout, connection to github.com closed">
  <style>
    text {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
      font-size: 14px;
    }
    .bar { font-size: 13px; }
    .c    { opacity: 0; animation: show 0.01s forwards; }
    .fade { opacity: 0; animation: show 0.45s ease-out forwards; }
    .cursor-cmd { animation: blink 1.1s step-end infinite, hide 0.1s 1.05s forwards; }
    @keyframes show  { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes hide  { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .c, .fade { animation: none; opacity: 1; }
      .cursor-cmd { animation: none; opacity: 0; }
    }
  </style>

  <!-- window -->
  <rect x="1.5" y="1.5" width="837" height="149" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- session end -->
  <text x="36" y="38" xml:space="preserve"><tspan fill="#1a7f37" font-weight="700">matej@cachyos</tspan><tspan fill="#57606a"> </tspan><tspan fill="#0969da" font-weight="700">~</tspan><tspan fill="#57606a"> $ </tspan><tspan fill="#1f2328"><tspan class="c" style="animation-delay:.40s">e</tspan><tspan class="c" style="animation-delay:.52s">x</tspan><tspan class="c" style="animation-delay:.64s">i</tspan><tspan class="c" style="animation-delay:.76s">t</tspan></tspan><tspan class="cursor-cmd" fill="#1f2328">█</tspan></text>
  <text class="fade" x="36" y="64" fill="#57606a" style="animation-delay:1.05s">logout</text>
  <text class="fade" x="36" y="90" fill="#57606a" style="animation-delay:1.35s">Connection to github.com closed.</text>

  <!-- tmux status bar -->
  <g class="fade" style="animation-delay:1.7s">
    <rect x="12" y="106" width="816" height="32" rx="6" fill="#eaeef2"/>
    <rect x="12" y="106" width="70" height="32" rx="6" fill="#1a7f37"/>
    <rect x="54" y="106" width="28" height="32" fill="#1a7f37"/>
    <text class="bar" x="47" y="127" text-anchor="middle" fill="#ffffff" font-weight="700">main</text>
    <text class="bar" x="98" y="127" xml:space="preserve"><tspan fill="#57606a">0:telekom  1:homelab  </tspan><tspan fill="#1a7f37" font-weight="700">2:portfolio*</tspan><tspan fill="#57606a">  3:japanese-</tspan></text>
    <text class="bar" x="816" y="127" text-anchor="end" xml:space="preserve" fill="#57606a">"matejejko" &#183; Ko&#353;ice, SK</text>
  </g>
</svg>
