<svg width="840" height="150" viewBox="0 0 840 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CI/CD pipeline: commit with git, build with docker, provision with terraform, deploy with kubernetes — all stages passing">
  <style>
    .stage { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
    .tool  { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 12px; }
    .fade  { opacity: 0; animation: show 0.25s ease-out forwards; }
    .check { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 0.4s ease-out forwards; }
    .grow  { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: growx 0.5s ease-in-out forwards; }
    .spin  {
      opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: show 0.1s 2.75s forwards, rot 0.7s linear 2.75s 2, hide 0.1s 4.15s forwards;
    }
    @keyframes show  { to { opacity: 1; } }
    @keyframes hide  { to { opacity: 0; } }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes growx { to { transform: scaleX(1); } }
    @keyframes rot   { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .fade  { animation: none; opacity: 1; }
      .check { animation: none; stroke-dashoffset: 0; }
      .grow  { animation: none; transform: none; }
      .spin  { display: none; }
    }
  </style>

  <!-- connectors -->
  <rect x="138" y="59" width="164" height="2" fill="#30363d"/>
  <rect x="338" y="59" width="164" height="2" fill="#30363d"/>
  <rect x="538" y="59" width="164" height="2" fill="#30363d"/>
  <rect class="grow" style="animation-delay:.60s" x="138" y="59" width="164" height="2" fill="#3fb950"/>
  <rect class="grow" style="animation-delay:1.40s" x="338" y="59" width="164" height="2" fill="#3fb950"/>
  <rect class="grow" style="animation-delay:2.20s" x="538" y="59" width="164" height="2" fill="#3fb950"/>

  <!-- stage 1: commit -->
  <circle cx="120" cy="60" r="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <g class="fade" style="animation-delay:.30s">
    <circle cx="120" cy="60" r="14" fill="#0d2417" stroke="#3fb950" stroke-width="2"/>
    <path class="check" style="animation-delay:.35s" pathLength="100" d="M114 60 L118.5 64.5 L126.5 56" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="stage" x="120" y="102" text-anchor="middle" fill="#e6edf3">commit</text>
  <text class="tool" x="120" y="121" text-anchor="middle" fill="#8b949e">git</text>

  <!-- stage 2: build -->
  <circle cx="320" cy="60" r="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <g class="fade" style="animation-delay:1.10s">
    <circle cx="320" cy="60" r="14" fill="#0d2417" stroke="#3fb950" stroke-width="2"/>
    <path class="check" style="animation-delay:1.15s" pathLength="100" d="M314 60 L318.5 64.5 L326.5 56" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="stage" x="320" y="102" text-anchor="middle" fill="#e6edf3">build</text>
  <text class="tool" x="320" y="121" text-anchor="middle" fill="#8b949e">docker</text>

  <!-- stage 3: provision -->
  <circle cx="520" cy="60" r="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <g class="fade" style="animation-delay:1.90s">
    <circle cx="520" cy="60" r="14" fill="#0d2417" stroke="#3fb950" stroke-width="2"/>
    <path class="check" style="animation-delay:1.95s" pathLength="100" d="M514 60 L518.5 64.5 L526.5 56" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="stage" x="520" y="102" text-anchor="middle" fill="#e6edf3">provision</text>
  <text class="tool" x="520" y="121" text-anchor="middle" fill="#8b949e">terraform</text>

  <!-- stage 4: deploy (spinner, then check) -->
  <circle cx="720" cy="60" r="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle class="spin" cx="720" cy="60" r="14" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="24 64" stroke-linecap="round"/>
  <g class="fade" style="animation-delay:4.15s">
    <circle cx="720" cy="60" r="14" fill="#0d2417" stroke="#3fb950" stroke-width="2"/>
    <path class="check" style="animation-delay:4.20s" pathLength="100" d="M714 60 L718.5 64.5 L726.5 56" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="stage" x="720" y="102" text-anchor="middle" fill="#e6edf3">deploy</text>
  <text class="tool" x="720" y="121" text-anchor="middle" fill="#8b949e">kubernetes</text>
</svg>
