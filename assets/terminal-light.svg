    <text class="art fade" x="36" y="232" xml:space="preserve" style="animation-delay:1.80s">           `/++++/+++++++:</text>
    <text class="art fade" x="36" y="248" xml:space="preserve" style="animation-delay:1.85s">          `/++++++++++++++:</text>
    <text class="art fade" x="36" y="264" xml:space="preserve" style="animation-delay:1.90s">         `/+++ooooooooooooo/`</text>
  </g>
  <g fill="#1a7f37">
    <text class="art fade" x="36" y="280" xml:space="preserve" style="animation-delay:1.95s">        ./ooosssso++osssssso+`</text>
    <text class="art fade" x="36" y="296" xml:space="preserve" style="animation-delay:2.00s">       .oossssso-````/ossssss+`</text>
    <text class="art fade" x="36" y="312" xml:space="preserve" style="animation-delay:2.05s">      -osssssso.      :ssssssso.</text>
    <text class="art fade" x="36" y="328" xml:space="preserve" style="animation-delay:2.10s">     :osssssss/        osssso+++.</text>
    <text class="art fade" x="36" y="344" xml:space="preserve" style="animation-delay:2.15s">    /ossssssss/        +ssssooo/-</text>
    <text class="art fade" x="36" y="360" xml:space="preserve" style="animation-delay:2.20s">  `/ossssso+/:-        -:/+osssso+-</text>
    <text class="art fade" x="36" y="376" xml:space="preserve" style="animation-delay:2.25s"> `+sso+:-`                 `.-/+oso:</text>
    <text class="art fade" x="36" y="392" xml:space="preserve" style="animation-delay:2.30s">`++:.                           `-/+/</text>
    <text class="art fade" x="36" y="408" xml:space="preserve" style="animation-delay:2.35s">.`                                 `/</text>
  </g>

  <!-- fetch output -->
  <text class="row fade" x="380" y="140" xml:space="preserve" style="animation-delay:1.45s"><tspan fill="#1a7f37" font-weight="700">matej</tspan><tspan fill="#1f2328">@</tspan><tspan fill="#1a7f37" font-weight="700">cachyos</tspan></text>
  <text class="row fade" x="380" y="162" xml:space="preserve" style="animation-delay:1.50s" fill="#8c959f">-------------</text>
  <text class="row fade" x="380" y="186" xml:space="preserve" style="animation-delay:1.60s"><tspan fill="#1a7f37" font-weight="700">OS:        </tspan><tspan fill="#1f2328">CachyOS Linux x86_64</tspan></text>
  <text class="row fade" x="380" y="210" xml:space="preserve" style="animation-delay:1.70s"><tspan fill="#1a7f37" font-weight="700">Role:      </tspan><tspan fill="#1f2328">DevOps Intern @ Deutsche Telekom</tspan></text>
  <text class="row fade" x="380" y="234" xml:space="preserve" style="animation-delay:1.80s"><tspan fill="#1a7f37" font-weight="700">Education: </tspan><tspan fill="#1f2328">CS @ SPŠE Košice · dual program</tspan></text>
  <text class="row fade" x="380" y="258" xml:space="preserve" style="animation-delay:1.90s"><tspan fill="#1a7f37" font-weight="700">Stack:     </tspan><tspan fill="#1f2328">Kubernetes · Docker · AWS · Git</tspan></text>
  <text class="row fade" x="380" y="282" xml:space="preserve" style="animation-delay:2.00s"><tspan fill="#1a7f37" font-weight="700">Languages: </tspan><tspan fill="#1f2328">Python · JavaScript · Bash</tspan></text>
  <text class="row fade" x="380" y="306" xml:space="preserve" style="animation-delay:2.10s"><tspan fill="#1a7f37" font-weight="700">Interests: </tspan><tspan fill="#1f2328">self-hosting · homelab · automation</tspan></text>
  <text class="row fade" x="380" y="330" xml:space="preserve" style="animation-delay:2.20s"><tspan fill="#1a7f37" font-weight="700">Locales:   </tspan><tspan fill="#1f2328">sk · en (C1) · ja (N4) · de (A2)</tspan></text>
  <text class="row fade" x="380" y="354" xml:space="preserve" style="animation-delay:2.30s"><tspan fill="#1a7f37" font-weight="700">Editor:    </tspan><tspan fill="#1f2328">Vim · VS Code</tspan></text>
  <text class="row fade" x="380" y="378" xml:space="preserve" style="animation-delay:2.40s"><tspan fill="#1a7f37" font-weight="700">WWW:       </tspan><tspan fill="#1f2328">matejejko.github.io</tspan></text>

  <!-- terminal color palette -->
