<svg width="840" height="464" viewBox="0 0 840 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal window running fastfetch: Matej, DevOps intern at Deutsche Telekom, CS student at SPSE Kosice">
  <style>
    text {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
    }
    .art { font-size: 13px; }
    .row { font-size: 14px; }
    .ttl { font-size: 13px; }
    .c    { opacity: 0; animation: show 0.01s forwards; }
    .fade { opacity: 0; animation: show 0.45s ease-out forwards; }
    .cursor     { animation: blink 1.1s step-end infinite; }
    .cursor-cmd { animation: blink 1.1s step-end infinite, hide 0.1s 1.5s forwards; }
    @keyframes show  { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes hide  { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .c, .fade { animation: none; opacity: 1; }
      .cursor-cmd { animation: none; opacity: 0; }
    }
  </style>

  <!-- window -->
  <rect x="1.5" y="1.5" width="837" height="461" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="28" cy="27" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="27" r="7" fill="#febc2e"/>
  <circle cx="76" cy="27" r="7" fill="#28c840"/>
  <text class="ttl" x="420" y="31.5" text-anchor="middle" fill="#57606a">matej@cachyos: ~</text>
  <line x1="1.5" y1="52" x2="838.5" y2="52" stroke="#d8dee4"/>

  <!-- prompt + typed command -->
  <text class="row" x="36" y="88" xml:space="preserve"><tspan fill="#1a7f37" font-weight="700">matej@cachyos</tspan><tspan fill="#57606a"> </tspan><tspan fill="#0969da" font-weight="700">~</tspan><tspan fill="#57606a"> $ </tspan><tspan fill="#1f2328"><tspan class="c" style="animation-delay:.50s">f</tspan><tspan class="c" style="animation-delay:.58s">a</tspan><tspan class="c" style="animation-delay:.66s">s</tspan><tspan class="c" style="animation-delay:.74s">t</tspan><tspan class="c" style="animation-delay:.82s">f</tspan><tspan class="c" style="animation-delay:.90s">e</tspan><tspan class="c" style="animation-delay:.98s">t</tspan><tspan class="c" style="animation-delay:1.06s">c</tspan><tspan class="c" style="animation-delay:1.14s">h</tspan></tspan><tspan class="cursor-cmd" fill="#1f2328">█</tspan></text>

  <!-- ascii logo -->
  <g fill="#2da44e">
    <text class="art fade" x="36" y="120" xml:space="preserve" style="animation-delay:1.45s">                  -`</text>
    <text class="art fade" x="36" y="136" xml:space="preserve" style="animation-delay:1.50s">                 .o+`</text>
    <text class="art fade" x="36" y="152" xml:space="preserve" style="animation-delay:1.55s">                `ooo/</text>
    <text class="art fade" x="36" y="168" xml:space="preserve" style="animation-delay:1.60s">               `+oooo:</text>
    <text class="art fade" x="36" y="184" xml:space="preserve" style="animation-delay:1.65s">              `+oooooo:</text>
