    <rect class="fade" style="animation-delay:2.50s" x="380" y="394" width="24" height="14" rx="2" fill="#57606a"/>
    <rect class="fade" style="animation-delay:2.54s" x="408" y="394" width="24" height="14" rx="2" fill="#cf222e"/>
    <rect class="fade" style="animation-delay:2.58s" x="436" y="394" width="24" height="14" rx="2" fill="#1a7f37"/>
