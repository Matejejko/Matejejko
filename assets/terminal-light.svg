    <rect class="fade" style="animation-delay:2.70s" x="520" y="394" width="24" height="14" rx="2" fill="#8250df"/>
    <rect class="fade" style="animation-delay:2.74s" x="548" y="394" width="24" height="14" rx="2" fill="#1b7c83"/>
    <rect class="fade" style="animation-delay:2.78s" x="576" y="394" width="24" height="14" rx="2" fill="#24292f"/>
  </g>

  <!-- fresh prompt -->
  <text class="row fade" x="36" y="442" xml:space="preserve" style="animation-delay:3.0s"><tspan fill="#1a7f37" font-weight="700">matej@cachyos</tspan><tspan fill="#57606a"> </tspan><tspan fill="#0969da" font-weight="700">~</tspan><tspan fill="#57606a"> $ </tspan><tspan class="cursor" fill="#1f2328">█</tspan></text>
